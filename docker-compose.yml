# Runs the FastAPI backend locally in a container (the frontend runs with `npm run dev`).
services:
  api:
    build: ./backend
    container_name: fraudies-api
    ports:
      - "8000:8000"
    environment:
      FF_CORS_ORIGINS: http://localhost:3000
    volumes:
      - fraudies-data:/app/data
      - fraudies-models:/app/models

volumes:
  fraudies-data:
  fraudies-models:
